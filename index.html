<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Study Dashboard</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f5f7fa; color: #333; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background-color: #2d3e50; color: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        #sidebar h2 { font-size: 18px; margin-bottom: 30px; color: #40a9ff; }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 4px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .nav-item.active { background-color: #1890ff; }
        #main-content { flex: 1; padding: 30px; overflow-y: auto; box-sizing: border-box; }
        .header-title { font-size: 24px; margin-top: 0; margin-bottom: 20px; color: #2d3e50; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .app-card { background: white; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e8e8e8; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); border-color: #1890ff; }
        .app-icon { font-size: 36px; margin-bottom: 10px; }
        .app-name { font-weight: 600; font-size: 14px; color: #333; }
        .app-tag { font-size: 11px; color: #888; margin-top: 4px; text-transform: uppercase; }
        #app-overlay { display: none; position: fixed; top: 0; left: 240px; right: 0; bottom: 0; background: #fff; z-index: 999; flex-direction: column; }
        #overlay-bar { background: #2d3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        #overlay-frame { flex: 1; border: none; width: 100%; height: 100%; }
        .close-btn { background: #ff4d4f; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div>
            <h2>Canvas Dashboard</h2>
            <div class="nav-item active" onclick="closeApp()">🏠 Core Apps</div>
            <div class="nav-item">Grades & Modules</div>
        </div>
        <div style="font-size: 11px; color: #7f8c8d; text-align: center;">Verified Student Station v5.2</div>
    </div>
    <div id="main-content">
        <h1 class="header-title">Educational Learning Resource Modules</h1>
        <div class="app-grid">
            <div class="app-card" onclick="openApp('YouTube Player', 'https://youtube.com')">
                <div class="app-icon">📺</div><div class="app-name">YouTube View</div><div class="app-tag">Media Stream</div>
            </div>
            <div class="app-card" onclick="openApp('TikTok Feed', 'https://tiktok.com')">
                <div class="app-icon">🎵</div><div class="app-name">TikTok Sync</div><div class="app-tag">Social Media</div>
            </div>
        </div>
    </div>
    <div id="app-overlay">
        <div id="overlay-bar">
            <span id="overlay-title" style="font-weight: bold;">Loading...</span>
            <button class="close-btn" onclick="closeApp()">Back to Dashboard</button>
        </div>
        <iframe id="overlay-frame" src=""></iframe>
    </div>
    <script>
        function openApp(name, url) {
            document.getElementById('overlay-title').innerText = name;
            document.getElementById('overlay-frame').src = url;
            document.getElementById('app-overlay').style.display = 'flex';
        }
        function closeApp() {
            document.getElementById('app-overlay').style.display = 'none';
            document.getElementById('overlay-frame').src = '';
        }
    </script>
</body>
</html>
