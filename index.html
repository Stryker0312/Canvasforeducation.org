<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Study Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 240px;
            background-color: #2d3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #sidebar h2 { font-size: 18px; margin-bottom: 30px; color: #40a9ff; }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 4px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .nav-item:hover { background-color: #3d5166; }
        .nav-item.active { background-color: #1890ff; }
        
        #main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .header-title { font-size: 24px; margin-top: 0; margin-bottom: 20px; color: #2d3e50; }
        
        /* Grid Layout */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .app-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e8e8e8;
        }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); border-color: #1890ff; }
        .app-icon { font-size: 36px; margin-bottom: 10px; }
        .app-name { font-weight: 600; font-size: 14px; color: #333; }
        .app-tag { font-size: 11px; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h2>Canvas Dashboard</h2>
            <div class="nav-item active">Core Applications</div>
            <div class="nav-item">Grades & Modules</div>
            <div class="nav-item">Syllabus Archive</div>
        </div>
        <div style="font-size: 11px; color: #7f8c8d; text-align: center;">Verified Student Station v4.2</div>
    </div>

    <div id="main-content">
        <h1 class="header-title">Educational Learning Resource Modules</h1>
        
        <div class="app-grid">
            <!-- Main Apps with Direct Links -->
            <div class="app-card" onclick="window.open('https://youtube.com', '_blank')">
                <div class="app-icon">📺</div>
                <div class="app-name">YouTube View</div>
                <div class="app-tag">Media Stream</div>
            </div>
            <div class="app-card" onclick="window.open('https://tiktok.com', '_blank')">
                <div class="app-icon">🎵</div>
                <div class="app-name">TikTok Sync</div>
                <div class="app-tag">Social Media</div>
            </div>
            <div class="app-card" onclick="window.open('https://angrybirds.com', '_blank')">
                <div class="app-icon">🐦</div>
                <div class="app-name">Angry Birds Physics</div>
                <div class="app-tag">Kinematics Lab</div>
            </div>
            <div class="app-card" onclick="window.open('https://roblox.com', '_blank')">
                <div class="app-icon">🟥</div>
                <div class="app-name">Roblox Access</div>
                <div class="app-tag">3D Studio Engine</div>
            </div>

            <!-- 21 Random Arcade and Logic Modules -->
            <script>
                const randomApps = [
                    { name: "Retro Snake", icon: "🐍", tag: "Logic Puzzle" },
                    { name: "Block Tetris", icon: "🧱", tag: "Geometry Lab" },
                    { name: "Space Dodge", icon: "🚀", tag: "Reflex Trainer" },
                    { name: "Classic Pong", icon: "🏓", tag: "Velocity Test" },
                    { name: "MineSweeper", icon: "💣", tag: "Probability" },
                    { name: "2048 Fusion", icon: "🔢", tag: "Math Grid" },
                    { name: "Pacman Arcade", icon: "🍕", tag: "Pathfinding" },
                    { name: "Geometry Dash", icon: "📐", tag: "Rhythm Calculation" },
                    { name: "Asteroids Core", icon: "🪨", tag: "Vector Physics" },
                    { name: "Chess Engine", icon: "👑", tag: "Tactical Theory" },
                    { name: "Flappy Falcon", icon: "🦅", tag: "Gravity Simulator" },
                    { name: "Sudoku Expert", icon: "✍️", tag: "Matrix Sorting" },
                    { name: "Tic-Tac-Toe AI", icon: "❌", tag: "Game Theory" },
                    { name: "Brick Breaker", icon: "🥎", tag: "Angle Analytics" },
                    { name: "Wordle Match", icon: "📝", tag: "Vocabulary Lab" },
                    { name: "Clicker Hero", icon: "🖱️", tag: "Resource Management" },
                    { name: "Dino Runner", icon: "🦖", tag: "Sprite Animation" },
                    { name: "Tower Builder", icon: "🏗️", tag: "Balance Mechanics" },
                    { name: "Memory Match", icon: "🃏", tag: "Cognitive Focus" },
                    { name: "Maze Runner", icon: "🌀", tag: "Topology Search" },
                    { name: "Speed Typer", icon: "⌨️", tag: "WPM Analytics" }
                ];

                randomApps.forEach(app => {
                    document.write(`
                        <div class="app-card" onclick="alert('Booting Local Sandbox for ${app.name}... Code frame active.')">
                            <div class="app-icon">${app.icon}</div>
                            <div class="app-name">${app.name}</div>
                            <div class="app-tag">${app.tag}</div>
                        </div>
                    `);
                });
            </script>
        </div>
    </div>
</body>
</html>
