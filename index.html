<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 220px; background-color: #2d3e50; color: white; padding: 20px; box-sizing: border-box; }
        #sidebar h2 { color: #40a9ff; margin-top: 0; }
        .nav-btn { padding: 10px; margin: 10px 0; background: #3d5166; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; }
        .nav-btn:hover { background: #1890ff; }
        #main-content { flex: 1; display: flex; flex-direction: column; background: #111; }
        #view-frame { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>My Dashboard</h2>
        <div class="nav-btn" onclick="loadSite('https://youtube.com')">📺 YouTube</div>
        <div class="nav-btn" onclick="loadSite('https://tiktok.com')">🎵 TikTok</div>
    </div>

    <div id="main-content">
        <iframe id="view-frame" src="https://youtube.com"></iframe>
    </div>

    <script>
        function loadSite(url) {
            document.getElementById('view-frame').src = url;
        }
    </script>

</body>
</html>
